openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: weather
    description: Weather forecast operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get a daily weather forecast for a location
      parameters:
        - name: location
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      responses:
        "200":
          description: Daily weather forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherForecast"
        "400":
          description: Invalid location or date parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Location or forecast date not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: Weather provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WeatherForecast:
      type: object
      properties:
        locationName:
          type: string
        region:
          type: ["string", "null"]
        country:
          type: string
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        dateLabel:
          type: string
        condition:
          type: string
        weatherCode:
          type: integer
        temperatureHighC:
          type: number
        temperatureLowC:
          type: number
        precipitationProbabilityPercent:
          type: ["integer", "null"]
      required:
        - locationName
        - region
        - country
        - date
        - dateLabel
        - condition
        - weatherCode
        - temperatureHighC
        - temperatureLowC
        - precipitationProbabilityPercent
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error

